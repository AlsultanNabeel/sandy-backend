name: Sandy Tests
on:
  push:
    branches:
      - "main"
      - "sandy-task-*"   # ساندي تنشئ هاد الـ branches وتنتظر CI قبل ما تفتح PR
  pull_request:
    branches: ["main"]

# السر هون: ضيف هاد المتغير على مستوى الـ workflow كامل
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov bandit ruff

      - name: Run tests with coverage
        run: |
          pytest tests/ -q --cov=cloud/app --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml

      - name: Security scan (bandit)
        run: |
          bandit -r cloud/ -ll

      - name: Code quality (ruff)
        run: |
          ruff check cloud/ scripts/

      - name: Secret scan (no committed keys)
        run: |
          leaks=$(git ls-files \
            | grep -iE '(^|/)\.env($|\.)|.*(gcloud|service[-_]account).*key.*\.json$|.*\.(pem|p12|pfx|key)$' \
            | grep -vE '\.env\.example$' || true)
          if [ -n "$leaks" ]; then
            echo "❌ Secret-looking file(s) tracked by git — remove and rotate the key:"
            echo "$leaks"
            exit 1
          fi
          echo "✅ no committed secrets"