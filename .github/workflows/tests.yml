name: Sandy Tests
on:
  push:
    branches:
      - "main"
      - "sandy-task-*"   # ساندي تنشئ هاد الـ branches وتنتظر CI قبل ما تفتح PR
  pull_request:
    branches: ["main"]

# السر هون: ضيف هاد المتغير على مستوى الـ workflow كامل
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        # Both files, both pinned. The tool versions used to be resolved fresh on
        # every run (`pip install pytest ruff ...` with no versions), so the same
        # commit could pass in the morning and fail after lunch because `ruff`
        # shipped a new rule — a red build with no change behind it, which is the
        # fastest way to teach a team to stop reading CI.
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests with coverage
        # `--cov-fail-under` is the point of measuring it. Without a floor the
        # coverage number was decoration: it could fall for twenty commits and
        # nothing would say so. 55 is set just under the current 57 — close
        # enough that deleting a tested module is caught, loose enough that an
        # ordinary refactor is not. Raise it when it earns raising; never lower
        # it to make a build pass.
        run: |
          pytest tests/ -q --cov=cloud/app --cov-report=xml --cov-fail-under=55

      - name: Upload coverage to Codecov
        # Not on a fork. `secrets` are not given to a workflow triggered from a
        # forked repository, so the token is empty there and the upload fails —
        # failing the build over a report, on exactly the contributions that
        # arrive from outside. `fail_ci_if_error: false` covers the rest: Codecov
        # being down is not this repository being broken.
        if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

      - name: Security scan (bandit)
        run: |
          bandit -r cloud/ -ll

      - name: Code quality (ruff)
        run: |
          ruff check cloud/ tests/ scripts/

      - name: Secret scan (no committed keys)
        run: |
          leaks=$(git ls-files \
            | grep -iE '(^|/)\.env($|\.)|.*(gcloud|service[-_]account).*key.*\.json$|.*\.(pem|p12|pfx|key)$' \
            | grep -vE '\.env\.example$|(^|/)fw_pubkey\.pem$' || true)
          # fw_pubkey.pem is the PUBLIC half of the release-signing key and has to
          # ship in the firmware. It is let through only while it holds no private key.
          if git grep -q "PRIVATE KEY" -- '*fw_pubkey.pem'; then
            leaks="$leaks firmware/brain-core/main/fw_pubkey.pem (contains a PRIVATE KEY)"
          fi
          if [ -n "$leaks" ]; then
            echo "❌ Secret-looking file(s) tracked by git — remove and rotate the key:"
            echo "$leaks"
            exit 1
          fi
          echo "✅ no committed secrets"
  # ── Firmware ────────────────────────────────────────────────────────────────
  #
  # Yesterday the firmware broke the build twice and nobody knew until the owner
  # ran the flash script by hand, cable in one hand, at the point where he wanted
  # a working robot. A compiler is cheap and it never forgets; this is the gate
  # that should have caught both.
  #
  # It only builds. Flashing needs the board, and the board is on a desk.
  firmware:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Provide placeholder secrets.h
        # secrets.h is gitignored (it holds the Wi-Fi password, the broker
        # credentials and the voice HMAC key). The compiler only needs the
        # symbols to exist, so CI writes a dummy — a build failure here is a
        # code failure, never a missing credential.
        run: |
          for f in firmware/brain-core/main vision-core; do
            [ -d "$f" ] || continue
            [ -f "$f/secrets.h" ] || cp "$f/secrets.example.h" "$f/secrets.h"
          done

      - name: Declaration order (C)
        # Runs before the compiler because it is instant and because the same
        # mistake has broken three builds: an identifier used above the line
        # that declares it. The compiler catches it too — five minutes and a
        # Docker pull later.
        run: python3 scripts/check_c_decl_order.py

      - name: Build the robot brain (ESP-IDF)
        uses: espressif/esp-idf-ci-action@v1
        with:
          # The exact version the owner builds and flashes with, from
          # dependencies.lock. A gate on a different toolchain is worse than no
          # gate: it can pass while the build that reaches the board fails, and
          # it did — v5.3 could not even read a lock file v6 had written.
          esp_idf_version: v6.0.1
          target: esp32s3
          path: firmware/brain-core

  # ── iPhone app ──────────────────────────────────────────────────────────────
  #
  # Twenty-one thousand lines of Swift with no build gate at all. This does not
  # run the app or take screenshots — it answers the one question that matters
  # before a merge: does it still compile?
  #
  # macOS runners are billed at ten times the Linux rate, so this stays a build
  # and a lint rather than a full test matrix.
  ios:
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Type-check the app sources
        # Drives the Swift compiler over the app sources directly (no signing,
        # no simulator): it catches the errors that actually happen here — a
        # renamed symbol, a wrong type, a missing argument — at the cost of a
        # typecheck rather than a full `xcodebuild` of ios/SandyApp.xcodeproj.
        run: |
          find ios/SandyApp -name '*.swift' -not -path '*/ 2/*' > /tmp/sources.txt
          echo "$(wc -l < /tmp/sources.txt) Swift files"
          xcrun swiftc -typecheck \
            -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -target arm64-apple-ios18.0 \
            -swift-version 5 \
            @/tmp/sources.txt

      # Style comes after correctness on purpose. Ordered the other way, one
      # long line hid the answer to "does it still compile?" — which is the only
      # question that can actually block a merge.
      #
      # No --strict: that promotes every warning to an error, so a 121-character
      # line failed the build alongside a force-unwrap. The rules that crash an
      # app are set to error severity in .swiftlint.yml and stop the build; the
      # rest are advice and print as advice.
      - name: Lint (SwiftLint)
        run: |
          brew install swiftlint
          swiftlint --config .swiftlint.yml
