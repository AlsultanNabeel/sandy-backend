# Swift already has ruff's counterpart on the Python side; this is the Swift half.
# Run: swiftlint  (brew install swiftlint)
#
# ── How this config is calibrated ───────────────────────────────────────────
#
# The first version of this file reported 347 violations across 105 files in a
# codebase that a careful file-by-file review had just called clean. When a
# linter and a reviewer disagree that badly, the linter is usually the one that
# is wrong, and it was: the config had been written from defaults and never run.
#
# So the rules are split by what they cost:
#
#   error   — things that crash a running app. These block a merge.
#   warning — things that make code harder to read. These print and do not.
#
# CI runs plain `swiftlint`, NOT `--strict`. Strict mode promotes every warning
# to an error, which made a 121-character line as fatal as a force-unwrap and
# turned the gate into noise everybody learns to ignore.

included:
  - ios/SandyApp
  - ios/SandyAppTests

excluded:
  - ios/SandyApp/Localization   # long single-line strings by design

disabled_rules:
  - todo                        # tracked in the map, not by the linter
  - trailing_comma

opt_in_rules:
  - empty_count
  - force_unwrapping
  - implicitly_unwrapped_optional
  - overridden_super_call
  - redundant_nil_coalescing
  - unused_import
  - vertical_whitespace_closing_braces

# ── Blocking: an app that crashes is not shippable ──────────────────────────
force_cast:
  severity: error
force_try:
  severity: error
force_unwrapping:
  severity: error
implicitly_unwrapped_optional:
  severity: error

# ── Advisory: size and shape ────────────────────────────────────────────────
#
# The error thresholds sit well above anything currently in the codebase on
# purpose. They are there to catch a file that doubles, not to relitigate the
# ones that are already written and readable.
line_length:
  warning: 120
  error: 200
  ignores_comments: true

type_body_length:
  warning: 400
  error: 800

file_length:
  warning: 500
  error: 1000

function_body_length:
  warning: 80
  error: 200

cyclomatic_complexity:
  warning: 12
  error: 25

nesting:
  type_level: 3

identifier_name:
  # One character is idiomatic Swift inside a closure — `map { t in ... }` reads
  # better than a ceremonial name for a value that lives for one line. The rule
  # is kept for what it is actually good at: catching a name that is misleading
  # or malformed, not one that is short.
  min_length: 1
  max_length: 60
  excluded:
    # Properties that mirror the server's JSON field-for-field. Renaming them to
    # camelCase means hand-writing CodingKeys for every model — more code, more
    # places to typo, and a decoder that fails at runtime rather than at build
    # time when the two drift apart. The snake_case here is the API's spelling,
    # deliberately preserved.
    - "^[a-z][a-z0-9]*(_[a-z0-9]+)+$"
