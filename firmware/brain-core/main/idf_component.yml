# Pinned to tested minor versions: a newer esp-sr can change the wake word's RAM
# needs and internal RAM has no slack. Bump on purpose and commit the new lock.
dependencies:
  espressif/esp-sr: "~2.4.6"                  # WakeNet on-device wake word engine
  lvgl/lvgl: "~8.3.11"
  espressif/esp_lcd_ili9341: "~2.0.2"
  espressif/esp_websocket_client: "~1.7.0"
  # esp-mqtt moved out of core IDF into the registry in IDF 6.0.
  espressif/mqtt: "~1.0.0"
  espressif/led_strip: "~3.0.3"               # on-board WS2812 status LED
