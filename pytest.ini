[pytest]
# **Where the tests are.** Without this line, `pytest` from the repo root walks
# everything and collects two things that are not tests:
#
#   firmware/brain-core/managed_components/  — vendored Espressif code, with its
#       own conftest that imports `pytest_embedded`, a plugin for running tests
#       on real hardware. Not installed here, and it should not be: that code is
#       not ours to test.
#
#   scripts/test_voice_ws.py — a manual probe that opens a websocket **at import
#       time**. Collection alone ran it, and it read pytest's own `-q` as the URL
#       to dial. So the suite failed before a single test of ours had run, with
#       an error about a bad URI, which is not a sentence anybody can act on.
#
# The name `test_*.py` is a convention with two meanings — "pytest should run
# this" and "a human runs this to test something by hand" — and pytest cannot
# tell them apart. Naming the directory is how you say which one you meant.
testpaths = tests

# `python3 -m pytest` from the root would otherwise not find `cloud/` or the repo
# root on the path; conftest.py handles the root, this handles the app package.
pythonpath = . cloud
