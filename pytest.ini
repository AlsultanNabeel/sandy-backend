[pytest]
# **Where the tests are.** Without this line, `pytest` from the repo root walks
# everything and collects two things that are not tests:
#
#   firmware/brain-core/managed_components/  — vendored Espressif code, with its
#       own conftest that imports `pytest_embedded`, a plugin for running tests
#       on real hardware. Not installed here, and it should not be: that code is
#       not ours to test.
#
# `scripts/` used to be the second reason: `scripts/test_voice_ws.py` was a
# manual probe that opened a websocket **at import time**, so collection alone
# ran it and it read pytest's own `-q` as the URL to dial — the suite failed
# before one test of ours ran, with an error about a bad URI. It is
# `probe_voice_ws.py` now, because `test_*.py` is a convention with two meanings
# — "pytest should run this" and "a human runs this by hand" — and pytest cannot
# tell them apart. Naming the file for what it is beats naming the directory
# around it.
testpaths = tests

# `python3 -m pytest` from the root would otherwise not find `cloud/` or the repo
# root on the path; conftest.py handles the root, this handles the app package.
pythonpath = . cloud
